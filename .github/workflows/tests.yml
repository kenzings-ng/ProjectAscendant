name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gates:
    name: Fast Gates (GDD & Backend QA)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: project_ascendant
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install psycopg2-binary

      - name: Verify Git LFS Pointers
        run: |
          python Tools/QA/verify_git_lfs_pointers.py --base origin/${{ github.base_ref || 'main' }}

      - name: Validate GDD Consistency
        run: |
          python Tools/QA/validate_gdd_consistency.py

      - name: Run Backend PostgreSQL Tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: project_ascendant
          PGUSER: postgres
          PGPASSWORD: password
        run: |
          python Tools/QA/test_backend_postgres.py

  ue-tests:
    name: Run UE Automation Tests (Manual Dispatch Only)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'kenzings-ng/ProjectAscendant' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run Unreal Engine Automation Tests
        # Delegates to run_headless_tests.sh so CI uses the exact same result parsing as local runs
        # (Discovered==Passed, Failed=0, Errors=0, queue finished); the script exits non-zero otherwise.
        run: |
          UPROJECT="${{ github.workspace }}/ProjectAscendant.uproject"
          if [ ! -f "${UPROJECT}" ]; then
            echo "[ERROR] .uproject not found at ${UPROJECT}"
            exit 1
          fi
          if [ -z "${UE_EDITOR_PATH:-}" ] && [ -n "${UE_EDITOR_CMD:-}" ]; then
            export UE_EDITOR_PATH="${UE_EDITOR_CMD}"
          fi
          bash "${{ github.workspace }}/Tools/QA/run_headless_tests.sh" --ue-only
        shell: bash

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: Saved/Logs/
