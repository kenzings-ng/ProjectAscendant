# ─── API DECISIONS ───────────────────────────────────────────────────────────
api_decisions:
  - purpose: netcode_replication_system
    status: active
    api: "UE 5.7 Iris Replication System"
    not: "Legacy Replication Graph / Direct RPC Spam"
    adr: docs/architecture/adr-0001-open-world-mmo-combat-networking.md
    reason: "Iris provides massive scalability for high player counts in open world contested combat."
    referenced_by:
      - docs/architecture/adr-0001-open-world-mmo-combat-networking.md
    added: 2026-09-15
    revised: ""

  - purpose: 2d_sprite_gas_montage_pipeline
    status: active
    api: "UAbilityTask_PlayPaperZDAnimAndWait + UPaperZDAnimNotifyState"
    not: "Invisible 3D Skeletal Mesh Proxy / Pure Timer DataTables"
    adr: docs/architecture/adr-0002-gas-integration-paperzd-pixel-sprites.md
    reason: "Zero-overhead headless server execution with exact pixel-frame hitbox synchronization."
    referenced_by:
      - docs/architecture/adr-0002-gas-integration-paperzd-pixel-sprites.md
    added: 2026-09-16
    revised: ""

  - purpose: inventory_replication_architecture
    status: active
    api: "FFastArraySerializer + UItemDataAsset"
    not: "UObject Subobjects / TArray<FItemData> Full Replication"
    adr: docs/architecture/adr-0003-server-authoritative-grid-inventory-fast-array.md
    reason: "Massively reduces bandwidth and eliminates UObject GC overhead for 3,000 active inventory slots per server shard."
    referenced_by:
      - docs/architecture/adr-0003-server-authoritative-grid-inventory-fast-array.md
    added: 2026-09-16
    revised: ""

# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
forbidden_patterns:
  - pattern: client_authoritative_hit_detection
    status: active
    description: "Clients must never report confirmed hits or damage amounts to the server."
    why: "Prevents cheat modifications, damage multiplying, and false hit registrations in an MMO environment."
    adr: docs/architecture/adr-0001-open-world-mmo-combat-networking.md
    added: 2026-09-15

  - pattern: physical_shared_loot_race
    status: active
    description: "Systems must never spawn free-for-all physical loot piles dropped on ground from bosses."
    why: "Creates toxic ninja-looting and biases towards high-mobility/close-range players; instanced contribution loot is required."
    adr: docs/architecture/adr-0001-open-world-mmo-combat-networking.md
    added: 2026-09-15

  - pattern: invisible_3d_skeletal_proxy_for_2d_sprites
    status: active
    description: "Never spawn invisible 3D skeletal meshes to run traditional 3D montages for 2D pixel characters."
    why: "Doubles component overhead and wastes CPU/RAM on Dedicated Server running 100 combatants."
    adr: docs/architecture/adr-0002-gas-integration-paperzd-pixel-sprites.md
    added: 2026-09-16

  - pattern: client_side_inventory_mutation
    status: active
    description: "Clients must never mutate item slots or quantities locally prior to Server confirmation."
    why: "Prevents item duplication exploits (duping) and desynchronization in contested multiplayer trading."
    adr: docs/architecture/adr-0003-server-authoritative-grid-inventory-fast-array.md
    added: 2026-09-16
