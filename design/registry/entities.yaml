# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: foundational_upgrade_cost
    status: active
    source: design/gdd/foundational-classes.md
    referenced_by:
      - design/gdd/foundational-classes.md
      - design/gdd/skill-progression-system.md
    variables:
      - target_level
      - base_gold
      - base_shards
      - foundational_discount
    output_range: [60, 300]
    expression: "round(base_gold * (1.0 - 0.40))"
    added: 2026-09-15
    revised: ""

  - name: vanguard_parry_reflection
    status: active
    source: design/gdd/foundational-classes.md
    referenced_by:
      - design/gdd/foundational-classes.md
      - design/gdd/combat-system.md
      - design/gdd/stagger-system.md
    variables:
      - base_parry_posture
      - shield_tier
    output_range: [40.0, 56.0]
    expression: "base_parry_posture * (1.0 + 0.10 * (shield_tier - 1))"
    added: 2026-09-15
    revised: ""

  - name: ranger_acrobatic_dash
    status: active
    source: design/gdd/foundational-classes.md
    referenced_by:
      - design/gdd/foundational-classes.md
      - design/gdd/dash-evasion.md
    variables:
      - base_dash_stamina
      - stamina_reduction
      - base_dash_duration
      - duration_reduction
    output_range: [20.0, 20.0]
    expression: "base_dash_stamina - 5.0"
    added: 2026-09-15
    revised: ""

  - name: enhancement_stat_scaling
    status: active
    source: design/gdd/blacksmithing-system.md
    referenced_by:
      - design/gdd/blacksmithing-system.md
      - design/gdd/attributes-system.md
    variables:
      - base_attack
      - enhancement_level
    output_range: [20.0, 400.0]
    expression: "round(base_attack * (1.0 + 0.05 * level))"
    added: 2026-09-15
    revised: ""

  - name: repair_cost_formula
    status: active
    source: design/gdd/blacksmithing-system.md
    referenced_by:
      - design/gdd/blacksmithing-system.md
      - design/gdd/inventory-system.md
      - design/gdd/merchant-economy.md
    variables:
      - base_price
      - durability_pct
    output_range: [1, 500]
    expression: "ceil(base_price * 0.25 * (1.0 - durability_pct))"
    added: 2026-09-15
    revised: ""

  - name: boss_dynamic_hp_scaling
    status: active
    source: design/gdd/zone-system.md
    referenced_by:
      - design/gdd/zone-system.md
      - docs/architecture/adr-0001-open-world-mmo-combat-networking.md
      - design/gdd/world-bosses.md
    variables:
      - base_max_hp
      - hp_scale_coefficient
      - combatant_count
    output_range: [5000, 1325000]
    expression: "round(base_max_hp * (1.0 + hp_scale_coefficient * max(0, combatant_count - 1)))"
    added: 2026-09-15
    revised: ""

  - name: boss_dynamic_posture_scaling
    status: active
    source: design/gdd/zone-system.md
    referenced_by:
      - design/gdd/zone-system.md
      - docs/architecture/adr-0001-open-world-mmo-combat-networking.md
      - design/gdd/stagger-system.md
    variables:
      - base_max_posture
      - posture_scale_coefficient
      - combatant_count
    output_range: [400.0, 18150.0]
    expression: "round(base_max_posture * (1.0 + posture_scale_coefficient * max(0, combatant_count - 1)))"
    added: 2026-09-15
    revised: ""

  - name: party_exp_share
    status: active
    source: design/gdd/zone-system.md
    referenced_by:
      - design/gdd/zone-system.md
      - docs/architecture/adr-0001-open-world-mmo-combat-networking.md
      - design/gdd/multiplayer-coop.md
    variables:
      - base_monster_exp
      - morale_bonus
      - valid_party_member_count
    output_range: [13, 57500]
    expression: "round((base_monster_exp * (1.0 + morale_bonus)) / valid_party_member_count)"
    added: 2026-09-15
    revised: ""

  - name: pve_death_gold_loss
    status: active
    source: design/gdd/zone-system.md
    referenced_by:
      - design/gdd/zone-system.md
      - docs/architecture/adr-0001-open-world-mmo-combat-networking.md
      - design/gdd/inventory-system.md
    variables:
      - current_gold
      - pve_gold_loss_ratio
    output_range: [0, 4999999]
    expression: "floor(current_gold * pve_gold_loss_ratio)"
    added: 2026-09-15
    revised: ""

  - name: pvp_victim_gold_loss
    status: active
    source: design/gdd/zone-system.md
    referenced_by:
      - design/gdd/zone-system.md
      - docs/architecture/adr-0001-open-world-mmo-combat-networking.md
      - design/gdd/inventory-system.md
    variables:
      - victim_current_gold
      - pvp_gold_steal_ratio
    output_range: [0, 2499999]
    expression: "floor(victim_current_gold * pvp_gold_steal_ratio)"
    added: 2026-09-15
    revised: ""

  - name: karma_bailout_cost
    status: active
    source: design/gdd/merchant-economy.md
    referenced_by:
      - design/gdd/merchant-economy.md
      - design/gdd/zone-system.md
    variables:
      - current_karma
      - karma_bailout_gold_per_point
    output_range: [50, 500000]
    expression: "abs(current_karma) * karma_bailout_gold_per_point"
    added: 2026-09-16
    revised: ""

  - name: vendor_sell_price
    status: active
    source: design/gdd/merchant-economy.md
    referenced_by:
      - design/gdd/merchant-economy.md
      - design/gdd/inventory-system.md
    variables:
      - item_base_price
      - vendor_sell_penalty
    output_range: [1, 2999999]
    expression: "floor(item_base_price * vendor_sell_penalty)"
    added: 2026-09-16
    revised: ""

  - name: wanted_surcharge_price
    status: active
    source: design/gdd/merchant-economy.md
    referenced_by:
      - design/gdd/merchant-economy.md
    variables:
      - item_base_price
      - wanted_surcharge_ratio
    output_range: [1, 11999999]
    expression: "ceil(item_base_price * (1.0 + wanted_surcharge_ratio))"
    added: 2026-09-16
    revised: ""

  - name: threat_score_calculation
    status: active
    source: design/gdd/multiplayer-coop.md
    referenced_by:
      - design/gdd/multiplayer-coop.md
      - design/gdd/boss-ai.md
    variables:
      - damage_hp
      - damage_posture
      - healing_done
      - is_taunt_active
    output_range: [0, 9999999]
    expression: "(damage_hp * 1.0) + (damage_posture * 2.5) + (healing_done * 0.5) * (is_taunt_active ? 5.0 : 1.0)"
    added: 2026-09-16
    revised: ""

  - name: threat_retarget_check
    status: active
    source: design/gdd/multiplayer-coop.md
    referenced_by:
      - design/gdd/multiplayer-coop.md
      - design/gdd/boss-ai.md
    variables:
      - candidate_threat
      - current_target_threat
      - threat_retarget_ratio
    output_range: [0, 1]
    expression: "candidate_threat >= (current_target_threat * 1.30)"
    added: 2026-09-16
    revised: ""




